<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clothing Store Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Clothing Store Manager</h1>
    <p>Track clothing items, stock, and prices in one simple dashboard.</p>
  </header>

  <main>
    <section class="card">
      <h2>Add New Item</h2>
      <form id="item-form">
        <div class="form-row">
          <label for="name">Item Name</label>
          <input id="name" type="text" placeholder="e.g., Denim Jacket" required />
        </div>

        <div class="form-row">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select category</option>
            <option>Tops</option>
            <option>Bottoms</option>
            <option>Dresses</option>
            <option>Outerwear</option>
            <option>Accessories</option>
          </select>
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label for="size">Size</label>
            <input id="size" type="text" placeholder="S / M / L / XL" required />
          </div>
          <div class="form-row">
            <label for="stock">Stock</label>
            <input id="stock" type="number" min="0" placeholder="0" required />
          </div>
          <div class="form-row">
            <label for="price">Price ($)</label>
            <input id="price" type="number" min="0" step="0.01" placeholder="0.00" required />
          </div>
        </div>

        <button type="submit">Add Item</button>
      </form>
    </section>

    <section class="card">
      <div class="table-head">
        <h2>Inventory</h2>
        <input id="search" type="search" placeholder="Search by name or category..." />
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Category</th>
              <th>Size</th>
              <th>Stock</th>
              <th>Price</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="inventory-body"></tbody>
        </table>
      </div>
    </section>

    <section class="summary card">
      <h2>Store Summary</h2>
      <div class="stats">
        <article>
          <h3 id="total-items">0</h3>
          <p>Total Products</p>
        </article>
        <article>
          <h3 id="total-stock">0</h3>
          <p>Total Stock</p>
        </article>
        <article>
          <h3 id="inventory-value">$0.00</h3>
          <p>Inventory Value</p>
        </article>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
